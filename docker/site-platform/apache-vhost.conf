<VirtualHost *:80>
  ServerName admin.growbigllp.com
  ServerAdmin webmaster@localhost

  DocumentRoot /var/www/html/site-platform/web

  <Directory /var/www/html/site-platform/web>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
  </Directory>

  <Directory /var/www/html/site-platform/vendor>
    Require all denied
  </Directory>

  <Directory /var/www/html/site-platform/private>
    Require all denied
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
