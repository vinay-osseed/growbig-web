<VirtualHost *:80>
  ServerName localhost
  DocumentRoot /var/www/html/web

  <Directory /var/www/html/web>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  <Directory /var/www/html/vendor>
    Require all denied
  </Directory>

  <Directory /var/www/html/private>
    Require all denied
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/site-platform-error.log
  CustomLog ${APACHE_LOG_DIR}/site-platform-access.log combined
</VirtualHost>
