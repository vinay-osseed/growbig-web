<VirtualHost *:80>
  ServerName admin.growbigllp.com
  ServerAlias api.growbigllp.com
  DocumentRoot /var/www/html/web

  <Directory /var/www/html/web>
    AllowOverride All
    Require all granted
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/site-platform-error.log
  CustomLog ${APACHE_LOG_DIR}/site-platform-access.log combined
</VirtualHost>
