        type:
          type: string
          example: job
        key:
          type: string
          example: frontend-developer
        title:
          type: string
          example: Frontend Developer
        summary:
          type: string
        department:
          type: string
          example: Engineering
        location:
          type: string
          example: Remote / Sawantwadi, India
        employmentType:
          type: string
          example: full_time
        experienceLevel:
          type: string
          example: 1-3 years
        salaryRange:
          type: string
        description:
          type: string
        responsibilities:
          type: string
        requirements:
          type: string
        closingDate:
          type: string
        order:
          type: integer
        isFeatured:
          type: boolean

    ServiceListItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: service
        key:
          type: string
        title:
          type: string
        summary:
          type: string
        icon:
          type: string
        accentColor:
          type: string
        image:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MediaImage'
        url:
          type: string
        order:
          type: integer
        isFeatured:
          type: boolean

    PartnerListItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: partner
        key:
          type: string
        title:
          type: string
        summary:
          type: string
        logo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MediaImage'
        website:
          type: string
        order:
          type: integer
        isFeatured:
          type: boolean

    TeamMemberListItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: teamMember
        key:
          type: string
        name:
          type: string
        role:
          type: string
        summary:
          type: string
        bio:
          type: string
        photo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MediaImage'
        email:
          type: string
        linkedinUrl:
          type: string
        order:
          type: integer
        isFeatured:
          type: boolean

    Button:
      type: object
      properties:
        text:
          type: string
        url:
          type: string

    PageMeta:
      type: object
      properties:
        status:
          type: boolean
        created:
          type: integer
        changed:
          type: integer

    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    MediaImage:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        alt:
          type: string
        url:
          type: string
        mime:
          type: string
        width:
          type: string
        height:
          type: string
        styles:
          $ref: '#/components/schemas/ImageStyles'

    ImageStyles:
      type: object
      properties:
        thumbnail:
          type: string
        card:
          type: string
        heroMobile:
          type: string
        heroDesktop:
          type: string
        social:
          type: string
        logo:
          type: string
        wide:
          type: string
        large:
          type: string
        medium:
          type: string

# Phase 8 documented endpoints:
# - GET /api/v1/pages/careers
# - GET /api/v1/pages/contact
# - GET /api/v1/content/jobs
# - GET /api/v1/content/jobs/{key}
# - GET /api/v1/forms/contact-us
# - POST /api/v1/forms/contact-us/submit
# - GET /api/v1/forms/job-application
# - POST /api/v1/forms/job-application/submit
#
# Notes:
# - contact_us includes optional budget_range.
# - job_application includes resume_upload metadata, but file upload is not API-supported yet.

# Phase 9 documented endpoints:
# - GET /api/v1/menus
# - GET /api/v1/menus/header
# - GET /api/v1/menus/footer
#
# Notes:
# - Header and footer menus are driven by Site Page menu fields.
# - Frontend should render navigation from backend menu responses.
