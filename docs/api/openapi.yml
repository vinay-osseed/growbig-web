openapi: 3.0.3
info:
  title: GrowBig Site Platform API
  description: Domain convention - <domain> is public UI, api.<domain> is API, admin.<domain> is Drupal admin. Frontend-ready API documentation for the reusable GrowBig Site Platform Drupal backend.
  version: 0.2.0

servers:
  - url: https://growbig-web.ddev.site
    description: Local DDEV
  - url: https://api.growbig-web.ddev.site
    description: Local DDEV API domain

tags:
  - name: Site
    description: Global site profile, branding, contact, SEO, social, and footer settings.
  - name: Pages
    description: Reusable frontend pages composed from structured sections.

paths:
  /api/v1/site:
    get:
      tags:
        - Site
      summary: Get active site profile
      description: Returns the active default Site Profile in a frontend-ready JSON structure.
      operationId: getSiteProfile
      responses:
        '200':
          description: Active site profile response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteProfile'

  /api/v1/pages:
    get:
      summary: List dynamic site pages
      description: Returns published dynamic pages available to the decoupled frontend.
      responses:
        '200':
          description: Dynamic page list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitePageList'

  /api/v1/pages/{slug}:
    get:
      tags:
        - Pages
      summary: Get page by slug
      description: Returns a published Site Page by page key, including SEO data and structured sections.
      operationId: getSitePage
      parameters:
        - name: slug
          in: path
          required: true
          description: Page key.
          schema:
            type: string
            example: home
      responses:
        '200':
          description: Site Page response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitePage'
              examples:
                home:
                  summary: Home page
                  value:
                    id: 2
                    type: page
                    title: Home
                    slug: home
                    pageType: home
                    summary: GrowBig homepage composed from reusable sections.
                    sites:
                      - id: 1
                        key: growbig
                        name: GrowBig Technologies LLP
                    seo:
                      title: GrowBig Technologies LLP | Digital Solutions That Drive Business Growth
                      description: GrowBig Technologies LLP delivers websites, mobile apps, custom software, cloud solutions, and digital consulting.
                      keywords: ''
                      canonicalUrl: ''
                      openGraph:
                        title: GrowBig Technologies LLP
                        description: Building digital solutions that drive business growth.
                        image: null
                      robots: index_follow
                    sections:
                      - id: 5
                        type: hero
                        badge: Premium IT Solutions - Est. 2020
                        heading: Building Digital Solutions That Drive Business Growth
                        highlightText: Solutions
                        description: GrowBig Technologies LLP delivers modern websites, mobile applications, cloud solutions, digital transformation, AI-powered software, branding, and technology consulting for startups and enterprises.
                        primaryButton:
                          text: Start Your Project
                          url: internal:/contact
                        secondaryButton:
                          text: View Services
                          url: internal:/services
                        image: null
                        imageAltText: ''
                        layoutVariant: split_image_right
                        backgroundStyle: dark_grid
                    meta:
                      status: true
                      created: 1783455604
                      changed: 1783455604
        '404':
          description: Page not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: not_found
                  message: Page not found.

  /api/v1/content/{source}:
    get:
      tags:
        - Pages
      summary: Get reusable content by source
      description: Returns reusable frontend-ready content items for services, partners, or team members.
      operationId: getReusableContent
      parameters:
        - name: source
          in: path
          required: true
          description: Reusable content source.
          schema:
            type: string
            enum:
              - services
              - partners
              - team
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return. Use 0 or omit for no limit.
          schema:
            type: integer
            default: 0
        - name: featuredOnly
          in: query
          required: false
          description: Return only featured items.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Reusable content list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReusableContentList'
        '400':
          description: Unsupported content source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: invalid_source
                  message: Unsupported content source.

  /api/v1/content/{source}/{key}:
    get:
      tags:
        - Pages
      summary: Get reusable content item by source and key
      description: Returns one frontend-ready reusable content item.
      operationId: getReusableContentItem
      parameters:
        - name: source
          in: path
          required: true
          description: Reusable content source.
          schema:
            type: string
            enum:
              - services
              - partners
              - team
        - name: key
          in: path
          required: true
          description: Content item key.
          schema:
            type: string
            example: website-development
      responses:
        '200':
          description: Reusable content detail response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReusableContentDetail'
        '400':
          description: Unsupported content source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: invalid_source
                  message: Unsupported content source.
        '404':
          description: Content item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: not_found
                  message: Content item not found.

  /api/v1/menus/{menu}:
    get:
      tags: [Menus]
      summary: Get one frontend menu
      parameters:
        - name: menu
          in: path
          required: true
          schema:
            type: string
            enum: [header, footer]
      responses:
        "200":
          description: Menu response.
        "404":
          description: Menu not found.
  /api/v1/forms/{form}:
    get:
      tags: [Forms]
      summary: Get public form metadata
      parameters:
        - name: form
          in: path
          required: true
          schema:
            type: string
            enum: [contact-us, job-application]
      responses:
        "200":
          description: Form metadata.
        "404":
          description: Form not found.
  /api/v1/forms/{form}/submit:
    post:
      tags: [Forms]
      summary: Submit a public form
      parameters:
        - name: form
          in: path
          required: true
          schema:
            type: string
            enum: [contact-us, job-application]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Submission created.
        "400":
          description: Invalid JSON or payload.
        "422":
          description: Validation failed.
  /api/v1/analytics/config:
    get:
      tags: [Analytics]
      summary: Get safe public analytics config
      responses:
        "200":
          description: Analytics config.
  /api/v1/admin/dashboard:
    get:
      tags: [Admin]
      summary: Get authenticated admin dashboard data
      description: Requires authenticated Drupal admin access.
      responses:
        "200":
          description: Admin dashboard data.
        "403":
          description: Access denied.

components:
  schemas:
    SiteProfile:
      type: object
      required:
        - id
        - type
        - name
        - shortName
        - domains
        - branding
        - contact
        - seo
        - social
        - theme
        - footer
        - meta
      properties:
        id:
          type: string
          example: growbig
        type:
          type: string
          example: site
        name:
          type: string
          example: GrowBig Technologies LLP
        shortName:
          type: string
          example: GrowBig
        tagline:
          type: string
        description:
          type: string
        domains:
          $ref: '#/components/schemas/SiteDomains'
        branding:
          $ref: '#/components/schemas/SiteBranding'
        contact:
          $ref: '#/components/schemas/SiteContact'
        seo:
          $ref: '#/components/schemas/SiteSeo'
        social:
          type: array
          items:
            $ref: '#/components/schemas/SocialLink'
        theme:
          $ref: '#/components/schemas/SiteTheme'
        footer:
          $ref: '#/components/schemas/SiteFooter'
        meta:
          $ref: '#/components/schemas/SiteMeta'

    SiteDomains:
      type: object
      properties:
        primary:
          type: string
          format: uri
        ui:
          type: string
          format: uri
        admin:
          type: string
          format: uri
        api:
          type: string
          format: uri
        website:
          type: string
          format: uri

    SiteBranding:
      type: object
      properties:
        logo:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MediaImage'
        favicon:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MediaImage'
        defaultImage:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MediaImage'

    SiteContact:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
        alternatePhone:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string
        workingHours:
          type: string
        map:
          $ref: '#/components/schemas/SiteMap'

    SiteMap:
      type: object
      properties:
        url:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true

    SiteSeo:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        image:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MediaImage'

    SocialLink:
      type: object
      properties:
        platform:
          type: string
        url:
          type: string
        icon:
          type: string
        order:
          type: integer

    SiteTheme:
      type: object
      properties:
        color:
          type: string

    SiteFooter:
      type: object
      properties:
        description:
          type: string
        copyright:
          type: string
        menus:
          $ref: '#/components/schemas/SiteFooterMenus'

    SiteFooterMenus:
      type: object
      properties:
        main:
          type: string
        quickLinks:
          type: string
        services:
          type: string

    SiteMeta:
      type: object
      properties:
        source:
          type: string
        nodeId:
          type: integer
          nullable: true
        isDefault:
          type: boolean
        isActive:
          type: boolean

    SitePageList:
      type: object
      required:
        - contractVersion
        - count
        - items
      properties:
        contractVersion:
          type: string
          example: '1.0'
        count:
          type: integer
          example: 2
        items:
          type: array
          items:
            $ref: '#/components/schemas/SitePageListItem'

    SitePageListItem:
      type: object
      required:
        - id
        - uuid
        - title
        - slug
        - pageType
        - route
        - api
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        title:
          type: string
          example: About
        slug:
          type: string
          example: about
        pageType:
          type: string
          example: about
        route:
          $ref: '#/components/schemas/PageRoute'
        api:
          $ref: '#/components/schemas/PageApiLinks'

    SitePage:
      type: object
      required:
        - contractVersion
        - id
        - uuid
        - type
        - title
        - slug
        - pageType
        - route
        - api
        - summary
        - sites
        - seo
        - sections
        - meta
      properties:
        contractVersion:
          type: string
          example: '1.0'
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        type:
          type: string
          example: page
        title:
          type: string
        slug:
          type: string
          example: home
        pageType:
          type: string
          example: home
        route:
          $ref: '#/components/schemas/PageRoute'
        api:
          $ref: '#/components/schemas/PageApiLinks'
        summary:
          type: string
        sites:
          type: array
          items:
            $ref: '#/components/schemas/PageSiteReference'
        seo:
          $ref: '#/components/schemas/PageSeo'
        sections:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/HeroSection'
              - $ref: '#/components/schemas/StatsSection'
              - $ref: '#/components/schemas/CardGridSection'
              - $ref: '#/components/schemas/CtaSection'
              - $ref: '#/components/schemas/ImageTextSection'
              - $ref: '#/components/schemas/ContentListSection'
        meta:
          $ref: '#/components/schemas/PageMeta'

    PageRoute:
      type: object
      properties:
        path:
          type: string
          example: /about
        apiPath:
          type: string
          example: /api/v1/pages/about

    PageApiLinks:
      type: object
      properties:
        self:
          type: string
          example: /api/v1/pages/about

    PageSiteReference:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
        name:
          type: string

    PageSeo:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        keywords:
          type: string
        canonicalUrl:
          type: string
        openGraph:
          $ref: '#/components/schemas/PageOpenGraph'
        robots:
          type: string

    PageOpenGraph:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        image:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MediaImage'

    HeroSection:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: hero
        badge:
          type: string
        heading:
          type: string
        highlightText:
          type: string
        description:
          type: string
        primaryButton:
          $ref: '#/components/schemas/Button'
        secondaryButton:
          $ref: '#/components/schemas/Button'
        image:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MediaImage'
        imageAltText:
          type: string
        layoutVariant:
          type: string
        backgroundStyle:
          type: string

    StatsSection:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: stats
        items:
          type: array
          items:
            $ref: '#/components/schemas/StatsItem'

    StatsItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: stat
        title:
          type: string
        count:
          type: integer
        prefix:
          type: string
        suffix:
          type: string
        icon:
          type: string
        order:
          type: integer

    CardGridSection:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: cardGrid
        badge:
          type: string
        heading:
          type: string
        description:
          type: string
        cards:
          type: array
          items:
            $ref: '#/components/schemas/CardItem'
        primaryButton:
          $ref: '#/components/schemas/Button'
        secondaryButton:
          $ref: '#/components/schemas/Button'
        layoutVariant:
          type: string

    CardItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: card
        title:
          type: string
        description:
          type: string
        icon:
          type: string
        image:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MediaImage'
        accentColor:
          type: string
        link:
          $ref: '#/components/schemas/Button'
        order:
          type: integer
        isActive:
          type: boolean

    CtaSection:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: cta
        badge:
          type: string
        heading:
          type: string
        description:
          type: string
        primaryButton:
          $ref: '#/components/schemas/Button'
        secondaryButton:
          $ref: '#/components/schemas/Button'
        layoutVariant:
          type: string
        backgroundStyle:
          type: string

    ImageTextSection:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: imageText
        badge:
          type: string
        heading:
          type: string
        description:
          type: string
        image:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MediaImage'
        imagePosition:
          type: string
        primaryButton:
          $ref: '#/components/schemas/Button'
        secondaryButton:
          $ref: '#/components/schemas/Button'
        layoutVariant:
          type: string

    ContentListSection:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          example: contentList
        badge:
          type: string
        heading:
          type: string
        description:
          type: string
        source:
          type: string
          enum:
            - services
            - partners
            - team
        limit:
          type: integer
        featuredOnly:
          type: boolean
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/ServiceListItem'
              - $ref: '#/components/schemas/PartnerListItem'
              - $ref: '#/components/schemas/TeamMemberListItem'
        primaryButton:
          $ref: '#/components/schemas/Button'
        secondaryButton:
          $ref: '#/components/schemas/Button'
        layoutVariant:
          type: string

    ReusableContentDetail:
      type: object
      properties:
        source:
          type: string
          enum:
            - services
            - partners
            - team
        key:
          type: string
        item:
          oneOf:
            - $ref: '#/components/schemas/ServiceListItem'
            - $ref: '#/components/schemas/PartnerListItem'
            - $ref: '#/components/schemas/TeamMemberListItem'

    ReusableContentList:
      type: object
      properties:
        source:
          type: string
          enum:
            - services
            - partners
            - team
        limit:
          type: integer
        featuredOnly:
          type: boolean
        count:
          type: integer
        items:
          type: array
          items:
            oneOf:
