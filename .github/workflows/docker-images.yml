name: Site Platform Docker Images

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/growbig-site-platform

jobs:
  build-site-platform:
    name: Build Site Platform image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f site-platform/composer.json
          test -f site-platform/composer.lock
          test -f docker/site-platform/Dockerfile
          test -f docker/site-platform/apache-vhost.conf
          test -f docker/site-platform/entrypoint.sh
          test -f docker/site-platform/prod-php.ini

      - name: Set image tags
        id: vars
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"

          if [ "${GITHUB_REF_NAME}" = "prod" ]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:prod"
              echo "${IMAGE_NAME}:latest"
              echo "${IMAGE_NAME}:prod-${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:dev"
              echo "${IMAGE_NAME}:dev-${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Site Platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/site-platform/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.title=GrowBig Site Platform
            org.opencontainers.image.description=Drupal Site Platform production image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
