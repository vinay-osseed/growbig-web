name: Site Platform Docker Images

on:
  push:
    branches:
      - dev
      - prod
    paths:
      - '.github/workflows/docker-images.yml'
      - 'docker/site-platform/**'
      - 'site-platform/**'
      - 'scripts/setup/site_platform_install_drupal_native_stack.sh'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: site-platform-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/site-platform

jobs:
  build-site-platform:
    name: Build Site Platform image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required build files
        run: |
          test -f site-platform/composer.json
          test -f site-platform/composer.lock
          test -f docker/site-platform/Dockerfile
          test -f docker/site-platform/apache-vhost.conf
          test -f docker/site-platform/entrypoint.sh
          test -f docker/site-platform/prod-php.ini

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev-${{ github.sha }},enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=prod-${{ github.sha }},enable=${{ github.ref == 'refs/heads/prod' }}
          labels: |
            org.opencontainers.image.title=GrowBig Site Platform
            org.opencontainers.image.description=Drupal Site Platform production image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/site-platform/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "Built image tags:"
          echo "${{ steps.meta.outputs.tags }}"
