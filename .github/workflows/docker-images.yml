name: Build and Push Docker Images

on:
  push:
    branches:
      - dev
      - main
      - prod
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    name: Build and push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Docker tags
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "prod" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push site-platform
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/site-platform/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/growbig-site-platform:${{ steps.vars.outputs.channel }}
            ${{ secrets.DOCKERHUB_USERNAME }}/growbig-site-platform:${{ steps.vars.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/growbig-site-platform:latest

      - name: Build and push site-frontend placeholder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/site-frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/growbig-site-frontend:${{ steps.vars.outputs.channel }}
            ${{ secrets.DOCKERHUB_USERNAME }}/growbig-site-frontend:${{ steps.vars.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/growbig-site-frontend:latest
