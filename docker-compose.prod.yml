services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - site-platform
      - site-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  site-platform:
    image: ${DOCKERHUB_NAMESPACE}/growbig-site-platform:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: docker/site-platform/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - drupal_files:/var/www/html/web/sites/default/files
      - drupal_private:/var/www/html/private
    depends_on:
      - db

  site-frontend:
    image: ${DOCKERHUB_NAMESPACE}/growbig-site-frontend:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: docker/site-frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DRUPAL_DATABASE_NAME}
      MARIADB_USER: ${DRUPAL_DATABASE_USER}
      MARIADB_PASSWORD: ${DRUPAL_DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci

volumes:
  caddy_data:
  caddy_config:
  mariadb_data:
  drupal_files:
  drupal_private:
