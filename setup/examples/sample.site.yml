site:
  key: yamltest
  name: YAML Test Site
  active: true
  isDefault: false
  defaultLanguage: en
  enabledLanguages:
    - en
  timezone: Asia/Kolkata
  domains:
    frontend:
      - www.yamltest.ddev.site
      - yamltest.ddev.site
    api:
      - api.yamltest.ddev.site
    admin:
      - admin.yamltest.ddev.site

pages:
  - key: home
    title: YAML Test Home
    slug: home
    path: /
    template: landing
    seoTitle: YAML Test Site
    seoDescription: YAML imported home page.
    weight: 0
    demo: true
    components:
      - type: hero
        key: home_hero
        variant: split
        adminLabel: YAML home hero
        title: YAML Test Site
        summary: This hero was imported from setup YAML.
        mediaUrl: /assets/demo/yaml-hero.png
        buttonLabel: Contact us
        buttonPath: /contact
      - type: rich_text
        key: home_intro
        variant: default
        adminLabel: YAML home intro
        title: YAML-driven setup
        body: Pages, content, menus, forms, and components can now be imported from YAML.
      - type: cta
        key: home_cta
        variant: dark
        adminLabel: YAML home CTA
        title: Ready to build from YAML?
        summary: The setup runner can now create page component data.
        buttonLabel: Start setup
        buttonPath: /contact
  - key: about
    title: YAML Test About
    slug: about
    path: /about
    template: default
    seoTitle: About YAML Test
    seoDescription: About page imported from YAML.
    weight: 10
    demo: true
    components:
      - type: rich_text
        key: about_intro
        variant: default
        adminLabel: YAML about intro
        title: About YAML Test
        body: This about page component was imported through the setup runner.

menus:
  - key: main
    title: YAML Main Menu
    label: Main menu
    weight: 0
    active: true
    demo: true
    items:
      - key: home
        title: Home
        linkType: page
        page: home
        weight: 0
      - key: about
        title: About
        linkType: page
        page: about
        weight: 10
      - key: contact
        title: Contact
        linkType: path
        path: /contact
        isButton: true
        weight: 20

forms:
  - key: contact
    title: YAML Contact Form
    label: Contact YAML Test
    description: Send a message to YAML Test.
    successMessage: Thanks for contacting YAML Test.
    active: true
    demo: true
    fields:
      - key: name
        type: text
        label: Name
        required: true
        placeholder: Your name
        weight: 0
      - key: email
        type: email
        label: Email
        required: true
        placeholder: you@example.com
        weight: 10
      - key: message
        type: textarea
        label: Message
        required: true
        placeholder: How can we help?
        weight: 20

content:
  - source: global
    key: footer_cta
    title: YAML Footer CTA
    label: Footer CTA
    variant: default
    summary: Imported reusable footer CTA.
    body: This reusable content block was imported from YAML.
    weight: 0
    demo: true
  - source: global
    key: announcement
    title: YAML Announcement
    label: Announcement
    variant: banner
    summary: YAML setup import is working.
    body: This block verifies setup import output.
    weight: 10
    demo: true
