site:
  key: yamltest
  name: YAML Test Site
  active: true
  isDefault: false
  defaultLanguage: en
  enabledLanguages:
    - en
  timezone: Asia/Kolkata
  domains:
    frontend:
      - www.yamltest.ddev.site
      - yamltest.ddev.site
    api:
      - api.yamltest.ddev.site
    admin:
      - admin.yamltest.ddev.site

pages:
  - key: home
    title: YAML Test Home
    slug: home
    path: /
    template: landing
    seoTitle: YAML Test Site
    seoDescription: YAML imported home page.
    weight: 0
    demo: true
  - key: about
    title: YAML Test About
    slug: about
    path: /about
    template: default
    seoTitle: About YAML Test
    seoDescription: About page imported from YAML.
    weight: 10
    demo: true

menus:
  - key: main
    title: YAML Main Menu
    label: Main menu
    weight: 0
    active: true
    demo: true
    items:
      - key: home
        title: Home
        linkType: page
        page: home
        weight: 0
      - key: about
        title: About
        linkType: page
        page: about
        weight: 10
      - key: contact
        title: Contact
        linkType: path
        path: /contact
        isButton: true
        weight: 20

forms:
  - key: contact
    storage: webform
    webformId: yamltest_contact
    title: YAML Contact Form
    label: Contact YAML Test
    description: Send a message to YAML Test.
    successMessage: Thanks for contacting YAML Test.
    active: true
    demo: true
    fields:
      - key: name
        type: text
        label: Name
        required: true
        placeholder: Your name
        weight: 0
      - key: email
        type: email
        label: Email
        required: true
        placeholder: you@example.com
        weight: 10
      - key: message
        type: textarea
        label: Message
        required: true
        placeholder: How can we help?
        weight: 20

content:
  - source: global
    key: footer_cta
    title: YAML Footer CTA
    label: Footer CTA
    variant: default
    summary: Imported reusable footer CTA.
    body: This reusable content block was imported from YAML.
    weight: 0
    demo: true
  - source: global
    key: announcement
    title: YAML Announcement
    label: Announcement
    variant: banner
    summary: YAML setup import is working.
    body: This block verifies setup import output.
    weight: 10
    demo: true
