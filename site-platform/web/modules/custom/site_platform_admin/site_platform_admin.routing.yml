site_platform_admin.dashboard:
  path: '/admin/site-dashboard'
  defaults:
    _controller: '\Drupal\site_platform_admin\Controller\SiteDashboardController::dashboard'
    _title: 'Site Dashboard'
  requirements:
    _permission: 'access content overview'

site_platform_admin.site_setup:
  path: '/admin/site-setup'
  defaults:
    _controller: '\Drupal\site_platform_admin\Controller\SiteSetupController::overview'
    _title: 'Site Setup'
  requirements:
    _permission: 'administer site setup'

site_platform_admin.site_setup_wizard:
  path: '/admin/site-setup/wizard'
  defaults:
    _form: '\Drupal\site_platform_admin\Form\SiteSetupWizardForm'
    _title: 'Setup Wizard'
  requirements:
    _permission: 'administer site setup'

site_platform_admin.site_setup_run:
  path: '/admin/site-setup/run'
  defaults:
    _form: '\Drupal\site_platform_admin\Form\SiteSetupRunForm'
    _title: 'Prepare Setup Run'
  requirements:
    _permission: 'administer site setup'
