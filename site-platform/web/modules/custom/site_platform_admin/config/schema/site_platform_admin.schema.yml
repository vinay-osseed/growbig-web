site_platform_admin.setup_status:
  type: config_object
  label: 'Site Platform Setup Status'
  mapping:
    installed:
      type: boolean
      label: 'Installed'
    completed:
      type: boolean
      label: 'Completed'
    locked:
      type: boolean
      label: 'Locked'
    current_step:
      type: string
      label: 'Current setup step'
    setup_id:
      type: string
      label: 'Setup ID'
    mode:
      type: string
      label: 'Setup mode'
    environment:
      type: string
      label: 'Environment'
    started_at:
      type: integer
      label: 'Started timestamp'
    completed_at:
      type: integer
      label: 'Completed timestamp'
    steps:
      type: mapping
      label: 'Setup steps'
      mapping:
        site_profile:
          type: string
          label: 'Site profile status'
        frontend_defaults:
          type: string
          label: 'Frontend defaults status'
        roles:
          type: string
          label: 'Roles status'
        pages:
          type: string
          label: 'Pages status'
        menus:
          type: string
          label: 'Menus status'
        forms:
          type: string
          label: 'Forms status'
        content:
          type: string
          label: 'Content status'
        analytics:
          type: string
          label: 'Analytics status'
        verification:
          type: string
          label: 'Verification status'

site_platform_admin.setup_manifest:
  type: config_object
  label: 'Site Platform Setup Manifest'
  mapping:
    setup_id:
      type: string
      label: 'Setup ID'
    nodes:
      type: sequence
      label: 'Created node IDs'
      sequence:
        type: integer
        label: 'Node ID'
    webforms:
      type: sequence
      label: 'Created webforms'
      sequence:
        type: string
        label: 'Webform ID'
    roles:
      type: sequence
      label: 'Created roles'
      sequence:
        type: string
        label: 'Role ID'
    config:
      type: sequence
      label: 'Created config'
      sequence:
        type: string
        label: 'Config name'
    files:
      type: sequence
      label: 'Created files'
      sequence:
        type: string
        label: 'File path'

site_platform_admin.setup_values:
  type: config_object
  label: 'Site Platform Setup Values'
  mapping:
    mode:
      type: string
      label: 'Setup mode'
    environment:
      type: string
      label: 'Environment'
    site:
      type: mapping
      label: 'Primary site values'
      mapping:
        name:
          type: string
          label: 'Site name'
        key:
          type: string
          label: 'Site key'
        primary_domain:
          type: string
          label: 'Primary domain'
        frontend_url:
          type: string
          label: 'Frontend URL'
        admin_url:
          type: string
          label: 'Admin URL'
        api_url:
          type: string
          label: 'API URL'
    contact:
      type: mapping
      label: 'Contact values'
      mapping:
        company_name:
          type: string
          label: 'Company name'
        primary_email:
          type: string
          label: 'Primary email'
        country:
          type: string
          label: 'Country'
    branding:
      type: mapping
      label: 'Branding values'
      mapping:
        theme_color:
          type: string
          label: 'Theme color'
        logo:
          type: string
          label: 'Logo'
        favicon:
          type: string
          label: 'Favicon'
    setup_options:
      type: mapping
      label: 'Setup options'
      mapping:
        create_default_pages:
          type: boolean
          label: 'Create default pages'
        create_default_menus:
          type: boolean
          label: 'Create default menus'
        create_default_forms:
          type: boolean
          label: 'Create default forms'
        create_default_roles:
          type: boolean
          label: 'Create default roles'
        create_demo_content:
          type: boolean
          label: 'Create demo content'
    analytics:
      type: mapping
      label: 'Analytics setup values'
      mapping:
        enabled:
          type: boolean
          label: 'Enable analytics'
        measurement_id:
          type: string
          label: 'Measurement ID'
    extra_sites:
      type: sequence
      label: 'Additional sites'
      sequence:
        type: mapping
        label: 'Additional site'
        mapping:
          name:
            type: string
            label: 'Site name'
          key:
            type: string
            label: 'Site key'
          primary_domain:
            type: string
            label: 'Primary domain'
          frontend_url:
            type: string
            label: 'Frontend URL'
          api_url:
            type: string
            label: 'API URL'
