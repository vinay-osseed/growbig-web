dependencies:
  config:
    - node.type.site_form
    - field.field.node.site_form.field_site_profile
    - field.field.node.site_form.field_form_key
    - field.field.node.site_form.field_form_label
    - field.field.node.site_form.field_form_description
    - field.field.node.site_form.field_form_success_message
    - field.field.node.site_form.field_form_is_active
    - field.field.node.site_form.field_is_demo
    - field.field.node.site_form.field_demo_source
id: node.site_form.default
targetEntityType: node
bundle: site_form
mode: default
status: true
content:
  title:
    type: string_textfield
    weight: -10
    region: content
    settings:
      size: 80
      placeholder: ''
    third_party_settings: {  }
  field_site_profile:
    type: entity_reference_autocomplete
    weight: 0
    region: content
    settings:
      match_operator: CONTAINS
      match_limit: 10
      size: 60
      placeholder: ''
    third_party_settings: {  }
  field_form_key:
    type: string_textfield
    weight: 1
    region: content
    settings:
      size: 60
      placeholder: ''
    third_party_settings: {  }
  field_form_label:
    type: string_textfield
    weight: 2
    region: content
    settings:
      size: 60
      placeholder: ''
    third_party_settings: {  }
  field_form_description:
    type: string_textarea
    weight: 3
    region: content
    settings:
      rows: 5
      placeholder: ''
    third_party_settings: {  }
  field_form_success_message:
    type: string_textarea
    weight: 4
    region: content
    settings:
      rows: 5
      placeholder: ''
    third_party_settings: {  }
  field_form_is_active:
    type: boolean_checkbox
    weight: 5
    region: content
    settings:
      display_label: true
    third_party_settings: {  }
  field_is_demo:
    type: boolean_checkbox
    weight: 6
    region: content
    settings:
      display_label: true
    third_party_settings: {  }
  field_demo_source:
    type: string_textfield
    weight: 7
    region: content
    settings:
      size: 60
      placeholder: ''
    third_party_settings: {  }
hidden:
  created: true
  path: true
  promote: true
  status: true
  sticky: true
  uid: true
