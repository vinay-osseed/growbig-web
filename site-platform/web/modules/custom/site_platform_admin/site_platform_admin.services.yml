services:
  site_platform_admin.setup_storage:
    class: Drupal\site_platform_admin\Service\SiteSetupStorage
    arguments:
      - '@config.factory'
      - '@state'

  site_platform_admin.setup_runner:
    class: Drupal\site_platform_admin\Service\SiteSetupRunner
    arguments:
      - '@config.factory'
      - '@datetime.time'
      - '@entity_type.manager'
      - '@site_platform_admin.setup_storage'
