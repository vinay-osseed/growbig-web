site_platform_api.site:
  path: '/api/v1/site'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\SiteApiController::site'
  requirements:
    _access: 'TRUE'
  methods: [GET]

site_platform_api.pages:
  path: '/api/v1/pages'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\PageApiController::pages'
  requirements:
    _access: 'TRUE'
  methods: [GET]

site_platform_api.page:
  path: '/api/v1/pages/{slug}'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\PageApiController::page'
  requirements:
    _access: 'TRUE'
    slug: '[A-Za-z0-9_-]+'
  methods: [GET]

site_platform_api.route_front:
  path: '/api/v1/routes'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\PageApiController::route'
    path: ''
  requirements:
    _access: 'TRUE'
  methods: [GET]

site_platform_api.route:
  path: '/api/v1/routes/{path}'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\PageApiController::route'
  requirements:
    _access: 'TRUE'
    path: '.+'
  methods: [GET]

site_platform_api.menus:
  path: '/api/v1/menus'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\MenuApiController::menus'
  requirements:
    _access: 'TRUE'
  methods: [GET]

site_platform_api.menu:
  path: '/api/v1/menus/{menu}'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\MenuApiController::menu'
  requirements:
    _access: 'TRUE'
    menu: '[A-Za-z0-9_-]+'
  methods: [GET]

site_platform_api.form:
  path: '/api/v1/forms/{form}'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\FormApiController::form'
  requirements:
    _access: 'TRUE'
    form: '[A-Za-z0-9_-]+'
  methods: [GET]

site_platform_api.form_submit:
  path: '/api/v1/forms/{form}/submit'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\FormApiController::submit'
  requirements:
    _access: 'TRUE'
    form: '[A-Za-z0-9_-]+'
  methods: [POST]

site_platform_api.content:
  path: '/api/v1/content'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\ContentApiController::content'
  requirements:
    _access: 'TRUE'
  methods: [GET]

site_platform_api.content_source:
  path: '/api/v1/content/{source}'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\ContentApiController::content'
    key: ''
  requirements:
    _access: 'TRUE'
    source: '[A-Za-z0-9_-]+'
  methods: [GET]

site_platform_api.content_item:
  path: '/api/v1/content/{source}/{key}'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\ContentApiController::contentItem'
  requirements:
    _access: 'TRUE'
    source: '[A-Za-z0-9_-]+'
    key: '[A-Za-z0-9_-]+'
  methods: [GET]


site_platform_api.media:
  path: '/api/v1/media'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\MediaApiController::media'
  requirements:
    _access: 'TRUE'
  methods: [GET]

site_platform_api.media_item:
  path: '/api/v1/media/{key}'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\MediaApiController::mediaItem'
  requirements:
    _access: 'TRUE'
    key: '[A-Za-z0-9_-]+'
  methods: [GET]

site_platform_api.seo:
  path: '/api/v1/seo'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\SeoApiController::seo'
  requirements:
    _access: 'TRUE'
  methods: [GET]

site_platform_api.seo_page:
  path: '/api/v1/seo/page/{slug}'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\SeoApiController::seoPage'
  requirements:
    _access: 'TRUE'
    slug: '[A-Za-z0-9_-]+'
  methods: [GET]

site_platform_api.analytics:
  path: '/api/v1/analytics'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\AnalyticsApiController::analytics'
  requirements:
    _access: 'TRUE'
  methods: [GET]

site_platform_api.search:
  path: '/api/v1/search'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\SearchApiController::search'
  requirements:
    _access: 'TRUE'
  methods: [GET]

site_platform_api.frontend_bootstrap:
  path: '/api/v2/frontend/bootstrap'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\FrontendContentController::bootstrap'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE

site_platform_api.frontend_page:
  path: '/api/v2/frontend/pages/{slug}'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\FrontendContentController::page'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE

site_platform_api.frontend_content:
  path: '/api/v2/frontend/content/{source}'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\FrontendContentController::content'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE

site_platform_api.frontend_form:
  path: '/api/v2/frontend/forms/{id}'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\FrontendContentController::form'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE

site_platform_api.frontend_form_submit:
  path: '/api/v2/frontend/forms/{id}/submit'
  methods: [POST]
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\FrontendContentController::submitForm'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE

site_platform_api.frontend_analytics:
  path: '/api/v2/frontend/analytics'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\FrontendContentController::analytics'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE


site_platform_api.frontend_admin_overview:
  path: '/admin/content/frontend'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\FrontendAdminController::overview'
    _title: 'Frontend Content'
  requirements:
    _permission: 'administer site configuration'

site_platform_api.frontend_admin_overview:
  path: '/admin/content/frontend'
  defaults:
    _controller: '\Drupal\site_platform_api\Controller\FrontendAdminController::overview'
    _title: 'Frontend Content'
  requirements:
    _permission: 'administer site configuration'
