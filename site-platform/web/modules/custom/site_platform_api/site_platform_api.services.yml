services:
  site_platform_api.media_normalizer:
    class: Drupal\site_platform_api\SitePlatformMediaNormalizer
    arguments:
      - '@entity_type.manager'
      - '@file_url_generator'

  site_platform_api.page_normalizer:
    class: Drupal\site_platform_api\SitePlatformPageNormalizer
    arguments:
      - '@site_platform_api.media_normalizer'
