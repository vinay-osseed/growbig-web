services:
  site_platform_api.media_normalizer:
    class: Drupal\site_platform_api\SitePlatformMediaNormalizer
    arguments:
      - '@entity_type.manager'
      - '@file_url_generator'

  site_platform_api.content_list_normalizer:
    class: Drupal\site_platform_api\SitePlatformContentListNormalizer
    arguments:
      - '@entity_type.manager'
      - '@site_platform_api.media_normalizer'

  site_platform_api.page_normalizer:
    class: Drupal\site_platform_api\SitePlatformPageNormalizer
    arguments:
      - '@site_platform_api.media_normalizer'
      - '@site_platform_api.content_list_normalizer'


  site_platform_api.site_setup_profile_subscriber:
    class: Drupal\site_platform_api\EventSubscriber\SiteSetupProfileSubscriber
    arguments:
      - '@state'
      - '@entity_type.manager'
      - '@file_url_generator'
    tags:
      - { name: event_subscriber }
